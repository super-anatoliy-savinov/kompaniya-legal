<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>КОМПАНИЯ — Правовые документы</title>
<style>
  :root {
    --bg: #0B0E14;
    --surface: #141924;
    --teal: #34F5C5;
    --purple: #B985FF;
    --text: #EAF0F6;
    --text-sec: #8C94A6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    max-width: 480px;
    width: 100%;
    background: var(--surface);
    border-radius: 24px;
    padding: 40px 32px;
    text-align: center;
    border: 1px solid rgba(52,245,197,0.15);
  }
  h1 {
    background: linear-gradient(90deg, var(--teal), var(--purple));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-size: 32px;
    margin: 0 0 8px;
  }
  p.tagline { color: var(--text-sec); margin: 0 0 32px; font-size: 14px; }
  a.link-btn {
    display: block;
    text-decoration: none;
    background: var(--teal);
    color: #000;
    font-weight: 700;
    padding: 14px;
    border-radius: 16px;
    margin-bottom: 12px;
    transition: opacity 0.2s;
  }
  a.link-btn.secondary {
    background: transparent;
    color: var(--text);
    border: 1.5px solid rgba(255,255,255,0.15);
  }
  a.link-btn:hover { opacity: 0.85; }
</style>
</head>
<body>
  <div class="card">
    <h1>КОМПАНИЯ</h1>
    <p class="tagline">Правовые документы приложения</p>
    <a class="link-btn" href="privacy.html">Политика конфиденциальности</a>
    <a class="link-btn secondary" href="terms.html">Условия использования</a>
  </div>
</body>
</html>
